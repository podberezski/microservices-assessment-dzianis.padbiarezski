plugins {
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
	id 'org.openapi.generator' version '7.10.0'
}

def openApiOutputDir = layout.buildDirectory.dir('generated/openapi').get().asFile

openApiGenerate {
	generatorName = 'spring'
	inputSpec = rootProject.file('api/order-service-swagger.yaml').absolutePath
	outputDir = openApiOutputDir.absolutePath
	apiPackage = 'com.loadup.order.api'
	modelPackage = 'com.loadup.order.dto'
	invokerPackage = 'com.loadup.order.invoker'
	configOptions = [
		interfaceOnly   : 'true',
		useSpringBoot3  : 'true',
		useTags         : 'true',
		skipDefaultInterface: 'true',
		useBeanValidation: 'true',
		openApiNullable : 'false'
	]
}

sourceSets {
	main {
		java {
			srcDir openApiOutputDir.absolutePath + '/src/main/java'
		}
	}
}

tasks.named('compileJava') {
	dependsOn tasks.named('openApiGenerate')
}

tasks.named('clean') {
	delete openApiOutputDir
}


dependencies {
	implementation project(':common-logging-starter')
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
	implementation 'io.github.resilience4j:resilience4j-retry:2.2.0'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
//	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
//	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
	implementation 'org.springframework.cloud:spring-cloud-stream'
	implementation 'org.springframework.cloud:spring-cloud-stream-binder-kafka'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	compileOnly 'org.projectlombok:lombok'
	implementation 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-opentelemetry-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.cloud:spring-cloud-stream-test-binder'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}
